<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>GradeCalc — free grade calculator</title>
<meta name="description" content="GradeCalc: a free grade calculator for university courses. Weighted grades, what you need on the final, term averages and GPA. Works in your browser, no account needed.">
<meta name="theme-color" content="#1a1c1d">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body class="welcome">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="GradeCalc home"><img src="/favicon.svg" alt="" width="26" height="26"><span>GradeCalc</span></a>
    <button class="back" id="back" type="button" aria-label="Back">‹ Back</button>
    <a class="btn icon nav-graphs-btn needs-data" id="nav-graphs" href="#/" aria-label="Graphs" title="Graphs"><svg class="nav-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2 2v12h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10.5 7.5 7l2 2 4-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Graphs</span></a>
    <span class="save-state" id="save-state" role="status" aria-live="polite"></span>
    <nav class="tools">
      <button type="button" class="btn primary only-desktop needs-data" id="add-mark">+ Mark</button>
      <button type="button" class="btn icon needs-data" id="undo" aria-label="Undo" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button type="button" class="btn icon needs-data" id="redo" aria-label="Redo" title="Redo (Ctrl+Y)" disabled>↷</button>
      <button type="button" class="btn needs-data" id="toggle-structure" aria-label="Edit structure" aria-pressed="false"><span class="long">Edit structure</span><span class="short">Edit</span></button>
      <button type="button" class="btn icon" id="account-btn" title="Sign in to sync across devices (optional)" aria-label="Sign in"><svg class="nav-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="5.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M2.6 14c.6-2.9 2.8-4.4 5.4-4.4s4.8 1.5 5.4 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button type="button" class="btn icon" id="open-settings" title="Settings" aria-label="Settings">⚙</button>
      <button type="button" class="btn icon" id="toggle-theme" title="Light / dark" aria-label="Switch light or dark theme">◐</button>
    </nav>
  </header>

  <div class="conflict no-print" id="conflict" role="alert" hidden>
    <strong>Changed in another tab —</strong>
    <button type="button" class="btn primary" id="conflict-reload">Reload</button>
    <span class="muted">Your last change wasn’t saved.</span>
  </div>
  <div class="conflict no-print" id="sync-banner" role="alert" hidden></div>

  <main class="panes">
    <section class="pane pane-overview" id="pane-overview" aria-label="Overview"></section>
    <section class="pane pane-term" id="pane-term" aria-label="Term"></section>
    <section class="pane pane-course" id="pane-course" aria-label="Course"></section>
  </main>

  <div class="loading" id="loading">Loading…</div>
  <button type="button" class="fab needs-data" id="fab-mark" aria-label="Add a mark">+ Mark</button>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog id="dlg" class="dlg"></dialog>
  <dialog id="sheet" class="dlg sheet"></dialog>
  <dialog id="drawer" class="dlg drawer"></dialog>
</body>
</html>
